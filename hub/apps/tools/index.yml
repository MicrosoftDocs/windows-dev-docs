  summary: Start with the tool that matches how you create and manage Windows app projects.
  items:
    - title: Visual Studio
      description: Create, edit, build, debug, package, and publish Windows apps in an integrated development environment.
      url: ../dev-tools/visual-studio.md
    - title: Visual Studio Code extension
      description: Run WinApp CLI commands from the Visual Studio Code Command Palette.
      url: ../develop/ai-assisted/vs-code-tools.md#winapp-vs-code-extension
    - title: WinApp CLI
      description: Configure projects, package apps, manage identity and certificates, and automate workflows with WinApp CLI.
      url: ../dev-tools/winapp-cli/index.md
    - title: WinUI Agent
      description: Give supported coding assistants Windows app development guidance and tools for inspecting running apps.
      url: ../develop/ai-assisted/winui-agent-plugin.md
