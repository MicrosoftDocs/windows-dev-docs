productOverview:
  title: Tools for Windows app development
  summary: Choose an editor, command-line workflow, AI-assisted tool, or testing approach for building and maintaining Windows apps.
getStarted:
  title: Choose your development environment
  summary: Start with the tool that matches how you prefer to create and manage Windows app projects.
  items:
    - title: Develop with Visual Studio
      description: Create, edit, build, debug, package, and publish Windows apps in an integrated development environment.
      url: ../dev-tools/visual-studio.md
    - title: Use the WinApp extension for Visual Studio Code
      description: Run Windows App Development CLI commands from the Visual Studio Code Command Palette.
      url: ../develop/ai-assisted/vs-code-tools.md#winapp-vs-code-extension
    - title: Work from the command line
      description: Configure projects, package apps, manage identity and certificates, and automate workflows with the winapp CLI.
      url: ../dev-tools/winapp-cli/index.md
