brand: windows
tocType: single
productOverview:
  title: Platform
  summary: Add Windows capabilities to your app, connect with the operating system, and build reliable experiences across devices and input methods.
getStarted:
  title: Choose where to start
  summary: Start with the part of the Windows platform that matches the feature you want to build.
  items:
    - title: Build your user interface
      description: Create app structure, controls, layouts, themes, and window experiences with WinUI 3.
      url: user-interface.md
    - title: Integrate with Windows
      description: Connect your app to notifications, sharing, search, widgets, app services, and other Windows experiences.
      url: windows-integration/index.md
    - title: Understand the platform
      description: Learn how Windows App SDK, Windows Runtime, Win32, .NET, and other platform technologies fit together.
      url: platform/index.md
