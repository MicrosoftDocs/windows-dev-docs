      title: Get started with WinUI
      url: ../get-started/index.yml
    - icon:
        src: ../images/fluent-blue/code.svg
        alt: Code brackets.
      title: Add Windows features
      url: ../develop/index.md
    - icon:
        src: ../images/fluent-blue/feature.svg
        alt: A puzzle piece representing app features.
      title: Package and deploy
      url: ../package-and-deploy/index.md
    - icon:
        src: ../images/fluent-blue/editor.svg
        alt: A design editor window.
      title: Publish through Microsoft Store
      url: ../publish/index.md
