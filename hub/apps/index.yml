productDirectory:
  title: Build and ship Windows apps
  summary: "Choose the part of the app development journey that matches what you want to do."
  items:
  - title: Getting started
    imageSrc: /windows/apps/images/hub-essentials.svg
    summary: "Learn how WinUI and the Windows App SDK work together, create your first app, and continue with a guided project."
    links:
      - url: /windows/apps/get-started
        text: Getting started with WinUI
      - url: /windows/apps/get-started/start-here
        text: Create your first WinUI app
      - url: /windows/apps/tutorials/winui-notes/intro
        text: Build a WinUI Notes app
  - title: Design
    imageSrc: /windows/apps/images/hub-design.svg
    summary: "Apply Windows design principles to create apps that feel native, accessible, and consistent with the platform."
    links:
      - url: /windows/apps/design/
        text: Windows app design overview
      - url: /windows/apps/design/design-principles
        text: Windows design principles
      - url: /windows/apps/design/guidelines-overview
        text: Windows app design guidelines
      - url: /windows/apps/design/downloads
        text: Design tools and resources
  - title: Add Windows features
    imageSrc: /windows/apps/images/hub-develop.svg
    summary: "Add windowing, notifications, file access, app lifecycle, input, graphics, and other Windows capabilities."
    links:
      - url: /windows/apps/develop/features-overview
        text: Windows app development overview
      - url: /windows/apps/develop/platform/
        text: Windows development platform concepts
      - url: /windows/apps/api-reference/
        text: Windows App SDK API reference
  - title: Modernize an existing app
    imageSrc: /windows/apps/images/hub-wasdk.svg
    summary: "Bring Windows App SDK features to an existing desktop app or migrate a UWP app to WinUI 3."
    links:
      - url: /windows/apps/desktop/modernize/
        text: Windows desktop app modernization
      - url: /windows/apps/windows-app-sdk/migrate-to-windows-app-sdk/overall-migration-strategy
        text: Migrate from UWP to Windows App SDK
      - url: /windows/apps/windows-app-sdk/use-windows-app-sdk-in-existing-project
        text: Use Windows App SDK in an existing project
  - title: Package and deploy
    imageSrc: /windows/apps/images/hub-package.svg
    summary: "Package your app with MSIX or deploy unpackaged. Choose between framework-dependent and self-contained deployment."
    links:
      - url: /windows/apps/package-and-deploy/
        text: Packaging and deployment overview
      - url: /windows/apps/package-and-deploy/packaging/
        text: MSIX packaging for Windows apps
      - url: /windows/apps/package-and-deploy/choose-distribution-path
        text: Choose a distribution path for your app
      - url: /windows/apps/package-and-deploy/deploy-overview
        text: Windows App SDK deployment options
  - title: Distribute through the Store
    imageSrc: /windows/apps/images/hub-publish.svg
    summary: "Publish your app in the Microsoft Store and manage its listing, certification, packages, and updates."
    links:
      - url: /windows/apps/publish/
        text: Microsoft Store publishing overview
      - url: /windows/apps/publish/get-started
        text: Get started with Microsoft Store publishing
      - url: /windows/apps/publish/partner-center/open-a-developer-account
        text: Open a Microsoft Store developer account
      - url: /windows/apps/publish/publish-your-app/msix/reserve-your-apps-name
        text: Submit your app to the Microsoft Store

